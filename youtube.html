<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>S4C Interiors | YouTube Videos</title>

  <meta name="description"
        content="Watch S4C Interiors interior design projects, home interiors, modular kitchens, bedrooms and more.">

  <link rel="stylesheet" href="style.css">

  <style>
    .youtube-page {
      padding: 100px 20px 60px;
      max-width: 1200px;
      margin: auto;
      text-align: center;
    }

    .youtube-page h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .youtube-page .subtitle {
      margin-bottom: 40px;
      opacity: .8;
    }

    .youtube-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .youtube-card {
      background: #111;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 25px rgba(0,0,0,.35);
    }

    .youtube-video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    .youtube-video iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .youtube-card h3 {
      padding: 15px;
      margin: 0;
    }

    .youtube-subscribe {
      display: inline-block;
      margin-top: 40px;
      padding: 14px 28px;
      background: #d4af37;
      color: #000;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
    }

    .youtube-subscribe:hover {
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .youtube-grid {
        grid-template-columns: 1fr;
      }

      .youtube-page h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<header>
  <div class="container">

    <a href="index.html">
